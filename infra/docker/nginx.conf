worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format structured escape=json
        '{"time":"$time_iso8601","method":"$request_method","uri":"$uri","status":$status}';
    access_log /dev/stdout structured;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 8k;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://api:8080;
            proxy_set_header Host $host;
            proxy_connect_timeout 3s;
            proxy_read_timeout 8s;
        }

        location /actuator/health {
            proxy_pass http://api:8080;
            proxy_connect_timeout 3s;
            proxy_read_timeout 8s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
