spring:
  application:
    name: blacksmith-api
  config:
    import: optional:configtree:/run/secrets/
  datasource:
    url: ${BLACKSMITH_DATABASE_URL}
    username: ${BLACKSMITH_DATABASE_USER:blacksmith}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 3000
      validation-timeout: 2000
      initialization-fail-timeout: 10000
  flyway:
    clean-disabled: true
    validate-on-migrate: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
    mapper:
      allow-coercion-of-scalars: false
  lifecycle:
    timeout-per-shutdown-phase: 15s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  tomcat:
    threads:
      max: 16
      min-spare: 2
    connection-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: 1.0

logging:
  structured:
    format:
      console: ecs
