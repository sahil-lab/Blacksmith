name: Blacksmith skeleton

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: blacksmith-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate the isolated local skeleton
        shell: pwsh
        run: ./scripts/Verify.ps1
      - name: Collect project service logs
        if: failure()
        run: docker compose --project-name blacksmith --file infra/docker/compose.yaml logs --no-color --tail 100 api web db
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blacksmith-test-evidence
          if-no-files-found: warn
          path: |
            services/api/target/surefire-reports
            services/api/target/failsafe-reports
            test-results
            playwright-report
      - name: Stop this project's services
        if: always()
        run: docker compose --project-name blacksmith --file infra/docker/compose.yaml --profile checks stop
